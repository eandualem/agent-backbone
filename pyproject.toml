[project]
name = "agent-backbone"
version = "2.0.0a0"
description = "Local control plane for terminal AI agents: run them, message them, coordinate them through GitHub Issues, reach them from Telegram."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agents", "claude-code", "codex", "tmux", "orchestration", "telegram", "github"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "python-telegram-bot>=21.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-socketio>=5.11",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
github-app = ["cryptography>=44.0"]

[project.scripts]
backbone = "agent_backbone.cli:main"
ab = "agent_backbone.cli:main"

[project.urls]
Homepage = "https://github.com/eandualem/agent-backbone"
Documentation = "https://github.com/eandualem/agent-backbone/blob/main/docs/README.md"
Source = "https://github.com/eandualem/agent-backbone"
Issues = "https://github.com/eandualem/agent-backbone/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.22",
    "ruff>=0.9",
    "asyncpg>=0.29",
    "cryptography>=44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_backbone"]

# The user documentation ships inside the wheel so an installed backbone can
# print it (`backbone docs <page>`) without a checkout of the repository.
[tool.hatch.build.targets.wheel.force-include]
"docs" = "agent_backbone/help/docs"

[tool.hatch.build.targets.sdist]
include = ["src/agent_backbone", "docs", "alembic.ini", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in defaults
    "RUF001", "RUF002", "RUF003",  # ❯ › — in prompts and docs are intentional
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM", "RUF", "C408"]
"src/agent_backbone/services/database/migrations/*" = ["E501", "I001"]  # autogenerated

[tool.coverage.run]
source = ["agent_backbone"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
