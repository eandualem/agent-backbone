[project]
name = "agent-backbone"
version = "2.0.0a0"
description = "Local control plane for terminal AI agents: run them, message them, coordinate them through GitHub Issues, reach them from Telegram."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agents", "claude-code", "codex", "tmux", "orchestration", "telegram", "github"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "python-telegram-bot>=21.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-socketio>=5.11",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
github-app = ["cryptography>=44.0"]

[project.scripts]
backbone = "agent_backbone.cli:main"

[project.urls]
Homepage = "https://github.com/eandualem/agent-backbone"
Issues = "https://github.com/eandualem/agent-backbone/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.9",
    "asyncpg>=0.29",
    "cryptography>=44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_backbone"]

[tool.hatch.build.targets.sdist]
include = ["src/agent_backbone", "alembic", "alembic.ini", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
