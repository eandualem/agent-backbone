name: Release

# Publishes to PyPI. Runs ONLY when triggered by hand — never on a push,
# a merge or a tag:
#
#   gh workflow run release.yml -f version=2.0.0a0
#
# or Actions → Release → Run workflow. The version you type must equal the
# one in pyproject.toml on the chosen ref; the job refuses otherwise.
# Authentication is the `PYPI_API_TOKEN` repository secret.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match pyproject.toml)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Check the requested version matches pyproject.toml
        run: |
          version="$(uv version --short)"
          test "${version}" = "${{ inputs.version }}" \
            || { echo "requested ${{ inputs.version }} != pyproject version ${version}"; exit 1; }
      - run: uv sync --all-extras
      - run: uv run pytest -q
      - run: uv build
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish
      - name: Tag the release
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
